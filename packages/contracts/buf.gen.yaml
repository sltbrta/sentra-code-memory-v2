version: v2
clean: true
managed:
  enabled: true
  disable:
    - file_option: go_package_prefix
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/sltbrta/sentra-code-memory-v2/packages/contracts/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.6
    revision: 1
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.2.5
    revision: 1
    out: gen/ts
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
  - remote: buf.build/connectrpc/go:v1.20.0
    revision: 1
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/protoschema-jsonschema:v0.6.0
    revision: 1
    out: gen/jsonschema
    opt: target=json-strict-bundle
    types:
      - ouroboros.contracts.v1.EventEnvelope

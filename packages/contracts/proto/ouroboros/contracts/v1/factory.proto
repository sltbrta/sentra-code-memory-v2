  // progress_per_mille is an optional measured completion value in [0, 1000].
  optional uint32 progress_per_mille = 7 [(buf.validate.field).uint32.lte = 1000];
  // causal supplies the canonical sequence, correlation, fence, and watermark.
  CausalContext causal = 8 [(buf.validate.field).required = true];
  // receipt supports the disclosed transition without exposing raw failures.
  Receipt receipt = 9 [(buf.validate.field).required = true];
  // evidence links progress to immutable outputs or validation artifacts.
  repeated EvidenceRef evidence = 10;
  // occurred_at records when this ordered progress transition became canonical.
  google.protobuf.Timestamp occurred_at = 11 [(buf.validate.field).required = true];
}

// ChangeIntent requests a scoped, reviewable change but cannot mutate source itself.
message ChangeIntent {
  // intent_id is an opaque change-intent identity.
  Identifier intent_id = 1 [(buf.validate.field).required = true];
  // requested_by identifies the authenticated human or authorized policy actor.
  AuthenticatedPrincipalRef requested_by = 2 [(buf.validate.field).required = true];
  // repository_git_oid pins the exact source base.
  string repository_git_oid = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    }
  ];
  // scope_digest binds approved paths, behaviors, and constraints.
  Digest scope_digest = 4 [(buf.validate.field).required = true];
  // supporting_evidence anchors the requested change to authorized evidence.
  repeated EvidenceRef supporting_evidence = 5 [(buf.validate.field).repeated.min_items = 1];
  // approval is required before implementation scheduling under policy.
  Approval approval = 6 [(buf.validate.field).required = true];
}

// ImpactReceipt records graph-derived obligations before source mutation is offered.
message ImpactReceipt {
  // receipt is the canonical impact-analysis result.
  Receipt receipt = 1;
  // base_git_oid is the exact source snapshot analyzed.
  string base_git_oid = 2;
  // affected_artifacts identify code, docs, config, and deployment obligations.
  repeated ArtifactRef affected_artifacts = 3;
  // uncertainty_reasons disclose incomplete graph or index coverage.
  repeated string uncertainty_reasons = 4;
}

// ChangeSet is an atomic candidate edit set tied to one exact Git base.
message ChangeSet {
  // change_set_id is an opaque candidate identity.
  Identifier change_set_id = 1 [(buf.validate.field).required = true];
  // base_git_oid is the exact Git tree or commit expected at application time.
  string base_git_oid = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    }
  ];
  // patch_artifact contains the immutable multi-file candidate patch.
  ArtifactRef patch_artifact = 3 [(buf.validate.field).required = true];
  // change_set_digest binds candidate edits, base, and metadata.
  Digest change_set_digest = 4 [(buf.validate.field).required = true];
  // validation_receipts record deterministic gates run on the isolated candidate.
  repeated Receipt validation_receipts = 5 [(buf.validate.field).repeated.min_items = 1];
  // rollback_artifact identifies the deterministic candidate rollback representation.
  ArtifactRef rollback_artifact = 6 [(buf.validate.field).required = true];
}

// DraftPullRequestAction requests one separately authorized idempotent draft PR effect.
message DraftPullRequestAction {
  // action_id is an opaque draft-PR action identity.
  Identifier action_id = 1;
  // change_set identifies the validated candidate offered for a draft PR.
  ChangeSet change_set = 2;
  // effect_approval supplies current authorization and idempotency binding.
  EffectApproval effect_approval = 3;
  // target_branch is the exact destination branch under repository policy.
  string target_branch = 4;
}

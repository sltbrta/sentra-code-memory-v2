  // target_realm_kind is the requested certified realm class.
  string target_realm_kind = 4;
  // requested_at records the handover request time.
  google.protobuf.Timestamp requested_at = 5;
}

// Finding records a bounded review, validation, or operational observation.
message Finding {
  // finding_id is an opaque finding identity.
  Identifier finding_id = 1;
  // task_id identifies the affected task.
  Identifier task_id = 2;
  // severity is a stable severity name under team policy.
  string severity = 3;
  // summary is a non-sensitive bounded description.
  string summary = 4;
  // evidence supports the finding.
  repeated EvidenceRef evidence = 5;
  // disposition_receipt records fixed, dismissed, deferred, or blocking state.
  Receipt disposition_receipt = 6;
}

// Notification records receipt-backed progress for a user-visible inbox.
message Notification {
  // notification_id is an opaque notification identity.
  Identifier notification_id = 1;
  // recipient is the authenticated intended recipient.
  AuthenticatedPrincipalRef recipient = 2;

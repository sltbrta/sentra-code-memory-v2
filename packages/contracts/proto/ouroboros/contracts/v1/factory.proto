// Canonical workflow, scheduling, roster, mailbox, and ChangeSet descriptions,
// plus the bounded Stage 05 factory boundary.
//
// These messages make orchestration state inspectable. The deterministic kernel
// remains responsible for all transition, lease, budget, and approval checks.
syntax = "proto3";

package ouroboros.contracts.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "ouroboros/contracts/v1/common.proto";
import "ouroboros/contracts/v1/ingestion.proto";
import "ouroboros/contracts/v1/local_authority.proto";
import "ouroboros/contracts/v1/security.proto";

// FactoryService provides the five bounded Stage 05 factory operations used by
// the thin TUI. Unknown, unauthorized, stale, and revoked runs share the
// static `not_found_or_denied` response shape and disclose no existence
// detail. No schedule, pull-request, cross-realm handover, or workflow
// composition operation is part of this bounded surface; the preexisting
// Schedule, Handover, WorkflowIR, and DraftPullRequestAction descriptions
// above remain canonical state with no Stage 05 behavior.
service FactoryService {
  // AdmitChangeIntent admits one approved ChangeIntent and opens its run.
  rpc AdmitChangeIntent(AdmitChangeIntentRequest) returns (AdmitChangeIntentResponse);
  // GetChangePlan reads the typed one-layer DAG for one admitted run.
  rpc GetChangePlan(GetChangePlanRequest) returns (GetChangePlanResponse);
  // PreviewChangeSet reads the atomic candidate preview with per-language
  // impact, documentation, and test obligations plus rollback facts.
  rpc PreviewChangeSet(PreviewChangeSetRequest) returns (PreviewChangeSetResponse);
  // GetReviewFindings pages typed fresh-review findings for one run.
  rpc GetReviewFindings(GetReviewFindingsRequest) returns (GetReviewFindingsResponse);
  // CancelChangeRun revokes one run at a safe point and denies pending effects.
  rpc CancelChangeRun(CancelChangeRunRequest) returns (CancelChangeRunResponse);
}

// ChangeRunState is the bounded v1 lifecycle of one admitted factory run.
enum ChangeRunState {
  // CHANGE_RUN_STATE_UNSPECIFIED is invalid in a served response.
  CHANGE_RUN_STATE_UNSPECIFIED = 0;
  // CHANGE_RUN_STATE_PLANNING decomposes the admitted intent into the DAG.
  CHANGE_RUN_STATE_PLANNING = 1;
  // CHANGE_RUN_STATE_READY has a validated plan awaiting execution.
  CHANGE_RUN_STATE_READY = 2;
  // CHANGE_RUN_STATE_RUNNING executes leased leaves.
  CHANGE_RUN_STATE_RUNNING = 3;
  // CHANGE_RUN_STATE_REVIEW runs the fresh typed review.
  CHANGE_RUN_STATE_REVIEW = 4;
  // CHANGE_RUN_STATE_CANDIDATE_READY holds a verified atomic candidate.
  CHANGE_RUN_STATE_CANDIDATE_READY = 5;
  // CHANGE_RUN_STATE_COMPLETED is the terminal retained-candidate state.
  CHANGE_RUN_STATE_COMPLETED = 6;
  // CHANGE_RUN_STATE_FAILED is the terminal bounded-failure state.
  CHANGE_RUN_STATE_FAILED = 7;
  // CHANGE_RUN_STATE_CANCELLED is the terminal revoked or cancelled state.
  CHANGE_RUN_STATE_CANCELLED = 8;
}

// PlanNodeKind distinguishes the orchestrator root from terminal workers.
enum PlanNodeKind {
  // PLAN_NODE_KIND_UNSPECIFIED is invalid in a served plan.
  PLAN_NODE_KIND_UNSPECIFIED = 0;
  // PLAN_NODE_KIND_ORCHESTRATOR is the single one-layer root.
  PLAN_NODE_KIND_ORCHESTRATOR = 1;
  // PLAN_NODE_KIND_LEAF is a terminal non-recursive implementation leaf.
  PLAN_NODE_KIND_LEAF = 2;
  // PLAN_NODE_KIND_REVIEW is the optional fresh read-only review node.
  PLAN_NODE_KIND_REVIEW = 3;
}

// FactoryGateKind is the bounded non-removable Stage 05 gate vocabulary.
enum FactoryGateKind {
  // FACTORY_GATE_KIND_UNSPECIFIED is invalid in a gate roster.
  FACTORY_GATE_KIND_UNSPECIFIED = 0;
  // FACTORY_GATE_KIND_BUILD is the deterministic build gate.
  FACTORY_GATE_KIND_BUILD = 1;
  // FACTORY_GATE_KIND_TEST is the deterministic test gate.
  FACTORY_GATE_KIND_TEST = 2;
  // FACTORY_GATE_KIND_DOCS is the documentation-obligation gate.
  FACTORY_GATE_KIND_DOCS = 3;
  // FACTORY_GATE_KIND_SECURITY is the security and escape gate.
  FACTORY_GATE_KIND_SECURITY = 4;
}

// FactoryGateStatus is the bounded lifecycle of one gate evaluation.
enum FactoryGateStatus {
  // FACTORY_GATE_STATUS_UNSPECIFIED is invalid in a served roster.
  FACTORY_GATE_STATUS_UNSPECIFIED = 0;
  // FACTORY_GATE_STATUS_PENDING has not run on the candidate.
  FACTORY_GATE_STATUS_PENDING = 1;
  // FACTORY_GATE_STATUS_RUNNING is evaluating the isolated candidate.
  FACTORY_GATE_STATUS_RUNNING = 2;
  // FACTORY_GATE_STATUS_PASSED satisfied the gate on the candidate.
  FACTORY_GATE_STATUS_PASSED = 3;
  // FACTORY_GATE_STATUS_FAILED failed the gate on the candidate.
  FACTORY_GATE_STATUS_FAILED = 4;
}

// CandidateState is the bounded all-or-nothing atomic-candidate lifecycle.
enum CandidateState {
  // CANDIDATE_STATE_UNSPECIFIED is invalid in a served preview.
  CANDIDATE_STATE_UNSPECIFIED = 0;
  // CANDIDATE_STATE_PROPOSED is a normalized edit set not yet applied.
  CANDIDATE_STATE_PROPOSED = 1;
  // CANDIDATE_STATE_APPLIED is fully applied in the isolated candidate.
  CANDIDATE_STATE_APPLIED = 2;
  // CANDIDATE_STATE_VERIFIED passed every required gate on the candidate.
  CANDIDATE_STATE_VERIFIED = 3;
  // CANDIDATE_STATE_REVIEWED completed the fresh typed review.
  CANDIDATE_STATE_REVIEWED = 4;
  // CANDIDATE_STATE_RETAINED is the terminal approved-candidate state.
  CANDIDATE_STATE_RETAINED = 5;
  // CANDIDATE_STATE_REJECTED is the terminal discarded-candidate state.
  CANDIDATE_STATE_REJECTED = 6;
}

// PreviewEditOperation is the bounded per-file candidate edit vocabulary.
enum PreviewEditOperation {
  // PREVIEW_EDIT_OPERATION_UNSPECIFIED is invalid in a preview.
  PREVIEW_EDIT_OPERATION_UNSPECIFIED = 0;
  // PREVIEW_EDIT_OPERATION_ADD creates one new repository-relative file.
  PREVIEW_EDIT_OPERATION_ADD = 1;
  // PREVIEW_EDIT_OPERATION_MODIFY edits one existing file in place.
  PREVIEW_EDIT_OPERATION_MODIFY = 2;
  // PREVIEW_EDIT_OPERATION_DELETE removes one existing file.
  PREVIEW_EDIT_OPERATION_DELETE = 3;
  // PREVIEW_EDIT_OPERATION_RENAME moves one existing file.
  PREVIEW_EDIT_OPERATION_RENAME = 4;
}

// ReviewSeverity is the bounded typed finding severity vocabulary.
enum ReviewSeverity {
  // REVIEW_SEVERITY_UNSPECIFIED is invalid in a served finding.
  REVIEW_SEVERITY_UNSPECIFIED = 0;
  // REVIEW_SEVERITY_INFO is advisory and never blocks.
  REVIEW_SEVERITY_INFO = 1;
  // REVIEW_SEVERITY_MINOR is a bounded local defect.
  REVIEW_SEVERITY_MINOR = 2;
  // REVIEW_SEVERITY_MAJOR is a material correctness defect.
  REVIEW_SEVERITY_MAJOR = 3;
  // REVIEW_SEVERITY_BLOCKER prevents candidate retention.
  REVIEW_SEVERITY_BLOCKER = 4;
}

// ReviewCategory is the bounded typed finding category vocabulary.
enum ReviewCategory {
  // REVIEW_CATEGORY_UNSPECIFIED is invalid in a served finding.
  REVIEW_CATEGORY_UNSPECIFIED = 0;
  // REVIEW_CATEGORY_CORRECTNESS covers logic and contract defects.
  REVIEW_CATEGORY_CORRECTNESS = 1;
  // REVIEW_CATEGORY_SECURITY covers authorization, escape, and secret defects.
  REVIEW_CATEGORY_SECURITY = 2;
  // REVIEW_CATEGORY_DATA_INTEGRITY covers atomicity and durability defects.
  REVIEW_CATEGORY_DATA_INTEGRITY = 3;
  // REVIEW_CATEGORY_DOCS covers documentation-obligation defects.
  REVIEW_CATEGORY_DOCS = 4;
  // REVIEW_CATEGORY_TESTS covers test-obligation defects.
  REVIEW_CATEGORY_TESTS = 5;
}

// FindingDisposition is the bounded typed finding outcome vocabulary.
enum FindingDisposition {
  // FINDING_DISPOSITION_UNSPECIFIED is invalid in a served finding.
  FINDING_DISPOSITION_UNSPECIFIED = 0;
  // FINDING_DISPOSITION_OPEN awaits orchestrator disposition.
  FINDING_DISPOSITION_OPEN = 1;
  // FINDING_DISPOSITION_FIXED was corrected inside the candidate.
  FINDING_DISPOSITION_FIXED = 2;
  // FINDING_DISPOSITION_DISMISSED_WITH_EVIDENCE was dismissed with citations.
  FINDING_DISPOSITION_DISMISSED_WITH_EVIDENCE = 3;
  // FINDING_DISPOSITION_DEFERRED was moved to a tracked follow-up.
  FINDING_DISPOSITION_DEFERRED = 4;
  // FINDING_DISPOSITION_BLOCKING prevents candidate retention.
  FINDING_DISPOSITION_BLOCKING = 5;
}

// UntrustedFactoryCaller carries body identity only for authenticated-context
// checks; the authenticated gateway session remains the sole authority.
message UntrustedFactoryCaller {
  // requested_principal must match the authenticated peer principal and tenant.
  AuthenticatedPrincipalRef requested_principal = 1 [(buf.validate.field).required = true];
  // requested_session must match the authenticated gateway session.
  Identifier requested_session = 2 [(buf.validate.field).required = true];
}

// ModelRoute records the deterministic provider-neutral routing decision for
// one leaf; escalation outside the routed profile is explicit and budgeted.
message ModelRoute {
  // profile_digest pins the certified runner/model/profile selection policy.
  Digest profile_digest = 1 [(buf.validate.field).required = true];
  // model_identity names the selected provider-neutral model identity.
  string model_identity = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 128
      pattern: "^[a-z0-9][a-z0-9._:-]{0,127}$"
    }
  ];
  // rationale_code is a stable non-sensitive routing rationale under policy.
  string rationale_code = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[a-z][a-z0-9_]*$"
    }
  ];
  // limits bounds leaf tokens, cost, wall time, and retries.
  repeated ResourceLimit limits = 4 [(buf.validate.field).repeated.max_items = 8];
}

// GateSpec binds one required or declared deterministic gate to its result.
message GateSpec {
  // gate_id is an opaque gate evaluation identity.
  Identifier gate_id = 1 [(buf.validate.field).required = true];
  // kind is the bounded gate vocabulary kind.
  FactoryGateKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // required marks the non-removable build, test, docs, and security gates.
  bool required = 3;
  // status is the bounded evaluation state on the isolated candidate.
  FactoryGateStatus status = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// PlanEdge describes one typed one-layer dependency inside a ChangePlan.
message PlanEdge {
  // from_node_id is the producing orchestrator node identifier.
  string from_node_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[a-z][a-z0-9-]{0,63}$"
    }
  ];
  // to_node_id is the consuming leaf or review node identifier.
  string to_node_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[a-z][a-z0-9-]{0,63}$"
    }
  ];
}

// PlanNode is one typed node of the bounded one-layer ChangePlan DAG.
message PlanNode {
  option (buf.validate.message).cel = {
    id: "plan_node.leaf_shape"
    message: "leaf nodes carry scope, lease, grant, and route; other nodes carry none"
    expression: "this.kind == 2 ? (this.owned_paths.size() > 0 && has(this.lease) && has(this.capability_grant) && has(this.route)) : (this.owned_paths.size() == 0 && this.forbidden_paths.size() == 0 && !has(this.lease) && !has(this.capability_grant) && !has(this.route))"
  };
  option (buf.validate.message).cel = {
    id: "plan_node.no_redispatch"
    message: "leaf grants never carry dispatch or task-creation authority"
    expression: "this.kind != 2 || !this.capability_grant.actions.exists(a, a in ['factory.dispatch', 'factory.task.create'])"
  };
  option (buf.validate.message).cel = {
    id: "plan_node.safe_paths"
    message: "owned and forbidden paths are normalized repository-relative paths"
    expression: "this.owned_paths.all(p, p.size() <= 4096 && p.matches('^[^/\\\\\\x00-\\x1f\\x7f](?:[^\\\\\\x00-\\x1f\\x7f]*[^/\\\\\\x00-\\x1f\\x7f])?$') && p.split('/').all(s, s != '' && s != '.' && s != '..')) && this.forbidden_paths.all(p, p.size() <= 4096 && p.matches('^[^/\\\\\\x00-\\x1f\\x7f](?:[^\\\\\\x00-\\x1f\\x7f]*[^/\\\\\\x00-\\x1f\\x7f])?$') && p.split('/').all(s, s != '' && s != '.' && s != '..'))"
  };
  // node_id is stable within one plan revision.
  string node_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[a-z][a-z0-9-]{0,63}$"
    }
  ];
  // kind distinguishes orchestrator, leaf, and review nodes.
  PlanNodeKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // goal_digest binds the exact node goal stored as an immutable artifact.
  Digest goal_digest = 3 [(buf.validate.field).required = true];
  // owned_paths lists the exact exclusive write scope for leaf nodes.
  repeated string owned_paths = 4 [(buf.validate.field).repeated.max_items = 64];
  // forbidden_paths lists explicit protected non-goal write boundaries.
  repeated string forbidden_paths = 5 [(buf.validate.field).repeated.max_items = 64];
  // route records the deterministic leaf model routing decision.
  ModelRoute route = 6;
  // lease records the sole fenced leaf owner.
  Lease lease = 7;
  // capability_grant pins the attenuated leaf execution authority.
  CapabilityGrant capability_grant = 8;
}

// ChangePlan is the frozen typed one-layer DAG compiled from one approved
// ChangeIntent: one orchestrator, at most three non-recursive leaves with
// disjoint write scopes, at most one fresh review node, and the non-removable
// gate roster.
message ChangePlan {
  option (buf.validate.message).cel = {
    id: "change_plan.single_orchestrator"
    message: "a change plan has exactly one orchestrator root"
    expression: "this.nodes.filter(n, n.kind == 1).size() == 1"
  };
  option (buf.validate.message).cel = {
    id: "change_plan.bounded_leaves"
    message: "a change plan delegates at least one and at most three leaves"
    expression: "this.nodes.filter(n, n.kind == 2).size() >= 1 && this.nodes.filter(n, n.kind == 2).size() <= 3"
  };
  option (buf.validate.message).cel = {
    id: "change_plan.bounded_review"
    message: "a change plan carries at most one fresh review node"
    expression: "this.nodes.filter(n, n.kind == 3).size() <= 1"
  };
  option (buf.validate.message).cel = {
    id: "change_plan.one_layer"
    message: "every edge originates at the orchestrator root"
    expression: "this.edges.all(e, this.nodes.exists(n, n.node_id == e.from_node_id && n.kind == 1))"
  };
  option (buf.validate.message).cel = {
    id: "change_plan.edge_endpoints"
    message: "every edge endpoint resolves to a declared node"
    expression: "this.edges.all(e, this.nodes.exists(n, n.node_id == e.from_node_id) && this.nodes.exists(n, n.node_id == e.to_node_id))"
  };
  option (buf.validate.message).cel = {
    id: "change_plan.no_root_loop"
    message: "no edge may target the orchestrator root"
    expression: "this.edges.all(e, !this.nodes.exists(n, n.node_id == e.to_node_id && n.kind == 1))"
  };
  option (buf.validate.message).cel = {
    id: "change_plan.no_orphan_nodes"
    message: "every non-orchestrator node has at least one incoming edge"
    expression: "this.nodes.filter(n, n.kind != 1).all(n, this.edges.exists(e, e.to_node_id == n.node_id))"
  };
  option (buf.validate.message).cel = {
    id: "change_plan.disjoint_write_scopes"
    message: "leaf write scopes are pairwise prefix-disjoint"
    expression: "this.nodes.filter(n, n.kind == 2).all(a, this.nodes.filter(n, n.kind == 2).all(b, a.node_id == b.node_id || !a.owned_paths.exists(p, b.owned_paths.exists(q, p == q || q.startsWith(p + '/') || p.startsWith(q + '/')))))"
  };
  option (buf.validate.message).cel = {
    id: "change_plan.unique_node_ids"
    message: "node identifiers are unique within one plan"
    expression: "this.nodes.all(a, this.nodes.filter(b, b.node_id == a.node_id).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "change_plan.unique_gate_ids"
    message: "gate identifiers are unique within one plan roster"
    expression: "this.gates.all(a, this.gates.filter(b, b.gate_id.namespace == a.gate_id.namespace && b.gate_id.value == a.gate_id.value).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "change_plan.required_gates"
    message: "the non-removable build, test, docs, and security gates are required"
    expression: "[1, 2, 3, 4].all(k, this.gates.exists(g, g.kind == k && g.required))"
  };
  option (buf.validate.message).cel = {
    id: "change_plan.leaf_base_binding"
    message: "leaf grants pin the exact intent Git base"
    expression: "this.nodes.filter(n, n.kind == 2).all(n, n.capability_grant.repository_git_oid == this.intent.repository_git_oid)"
  };
  // plan_id is an opaque immutable plan revision identity.
  Identifier plan_id = 1 [(buf.validate.field).required = true];
  // run_id identifies the admitted run owning this plan.
  Identifier run_id = 2 [(buf.validate.field).required = true];
  // intent is the admitted approved change intent.
  ChangeIntent intent = 3 [(buf.validate.field).required = true];
  // state is the bounded run lifecycle state.
  ChangeRunState state = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // nodes is the complete bounded one-layer node set.
  repeated PlanNode nodes = 5 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 5
  }];
  // edges is the complete bounded one-layer dependency set.
  repeated PlanEdge edges = 6 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4
  }];
  // gates is the bounded roster including the non-removable required gates.
  repeated GateSpec gates = 7 [(buf.validate.field).repeated = {
    min_items: 4
    max_items: 8
  }];
}

// PreviewEdit is one normalized per-file candidate edit tied to one P5 lane.
message PreviewEdit {
  option (buf.validate.message).cel = {
    id: "preview_edit.safe_paths"
    message: "preview edit paths are normalized repository-relative paths"
    expression: "this.path.size() <= 4096 && this.path.matches('^[^/\\\\\\x00-\\x1f\\x7f](?:[^\\\\\\x00-\\x1f\\x7f]*[^/\\\\\\x00-\\x1f\\x7f])?$') && this.path.split('/').all(s, s != '' && s != '.' && s != '..') && (!has(this.old_path) || (this.old_path.size() <= 4096 && this.old_path.matches('^[^/\\\\\\x00-\\x1f\\x7f](?:[^\\\\\\x00-\\x1f\\x7f]*[^/\\\\\\x00-\\x1f\\x7f])?$') && this.old_path.split('/').all(s, s != '' && s != '.' && s != '..')))"
  };
  option (buf.validate.message).cel = {
    id: "preview_edit.rename_shape"
    message: "only rename edits carry an old path distinct from the new path"
    expression: "this.operation == 4 ? (has(this.old_path) && this.old_path != this.path) : !has(this.old_path)"
  };
  option (buf.validate.message).cel = {
    id: "preview_edit.operation_digests"
    message: "add, delete, modify, and rename edits carry exact before and after digests"
    expression: "(this.operation == 1 && !has(this.before_digest) && has(this.after_digest)) || (this.operation == 3 && has(this.before_digest) && !has(this.after_digest)) || ((this.operation == 2 || this.operation == 4) && has(this.before_digest) && has(this.after_digest))"
  };
  // path is the normalized post-image repository-relative path.
  string path = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 4096
  ];
  // old_path is the normalized pre-image path for rename edits only.
  optional string old_path = 2 [(buf.validate.field).string.max_len = 4096];
  // operation is the bounded per-file edit vocabulary.
  PreviewEditOperation operation = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // language binds the edit to exactly one P5 language lane.
  CodeLanguage language = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // before_digest pins the exact pre-image file bytes when they exist.
  Digest before_digest = 5;
  // after_digest pins the exact post-image file bytes when they exist.
  Digest after_digest = 6;
}

// LanguageObligation freezes the impact, documentation, and test obligations
// owed for one touched P5 language before a candidate may verify.
message LanguageObligation {
  // language identifies the touched P5 language lane.
  CodeLanguage language = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // impact is the graph-derived impact analysis for this lane.
  ImpactReceipt impact = 2 [(buf.validate.field).required = true];
  // docs_required records the documentation obligation for this lane.
  bool docs_required = 3;
  // tests_required records the test obligation for this lane.
  bool tests_required = 4;
}

// ChangeSetPreview is the served atomic multi-file candidate preview: one
// exact-base ChangeSet bound to the admitted run's approved Git base, its
// normalized per-file edits, per-language obligations, the gate roster, and
// rollback facts. Application is all-or-nothing; a rejected candidate carries
// a rollback receipt and canonical source is never mutated by this boundary.
message ChangeSetPreview {
  option (buf.validate.message).cel = {
    id: "change_set_preview.unique_paths"
    message: "post-image edit paths are unique within one preview"
    expression: "this.edits.all(a, this.edits.filter(b, b.path == a.path).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "change_set_preview.unique_preimages"
    message: "pre-image edit paths are unique within one preview"
    expression: "this.edits.all(a, a.operation == 1 || this.edits.filter(b, (b.operation == 4 ? b.old_path : (b.operation == 1 ? '' : b.path)) == (a.operation == 4 ? a.old_path : a.path)).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "change_set_preview.obligation_per_language"
    message: "every touched language has exactly one obligation and obligations touch only edited languages"
    expression: "this.edits.map(e, e.language).all(l, this.obligations.exists(o, o.language == l)) && this.obligations.all(o, this.edits.exists(e, e.language == o.language)) && this.obligations.all(a, this.obligations.filter(b, b.language == a.language).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "change_set_preview.atomic_gates"
    message: "verified, reviewed, and retained candidates require every required gate passed"
    expression: "(this.candidate_state == 3 || this.candidate_state == 4 || this.candidate_state == 5) ? this.gates.filter(g, g.required).all(g, g.status == 3) : true"
  };
  option (buf.validate.message).cel = {
    id: "change_set_preview.rollback_binding"
    message: "a rejected candidate carries its rollback receipt"
    expression: "this.candidate_state == 6 ? has(this.rollback_receipt) : true"
  };
  option (buf.validate.message).cel = {
    id: "change_set_preview.base_binding"
    message: "the candidate base must equal the admitted intent's approved Git base"
    expression: "this.change_set.base_git_oid == this.expected_base_git_oid"
  };
  option (buf.validate.message).cel = {
    id: "change_set_preview.unique_gate_ids"
    message: "gate identifiers are unique within one preview roster"
    expression: "this.gates.all(a, this.gates.filter(b, b.gate_id.namespace == a.gate_id.namespace && b.gate_id.value == a.gate_id.value).size() == 1)"
  };
  // change_set is the immutable exact-base atomic candidate.
  ChangeSet change_set = 1 [(buf.validate.field).required = true];
  // candidate_state is the bounded all-or-nothing lifecycle state.
  CandidateState candidate_state = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // edits is the normalized per-file candidate edit set.
  repeated PreviewEdit edits = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];
  // obligations carries exactly one obligation per touched P5 language.
  repeated LanguageObligation obligations = 4 [(buf.validate.field).repeated = {
    min_items: 1

// MisfirePolicy defines behavior when a scheduled occurrence is missed.
enum MisfirePolicy {
  MISFIRE_POLICY_UNSPECIFIED = 0;
  MISFIRE_POLICY_COALESCE_ONE = 1;
  MISFIRE_POLICY_SKIP_AND_NOTIFY = 2;
  MISFIRE_POLICY_BOUNDED_CATCH_UP = 3;
}

// TaskState is the canonical roster state, not a runner-native task-list status.
enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_READY = 2;
  TASK_STATE_LEASED = 3;
  TASK_STATE_RUNNING = 4;
  TASK_STATE_BLOCKED = 5;
  TASK_STATE_REVIEW = 6;
  TASK_STATE_COMPLETED = 7;
  TASK_STATE_CANCELLED = 8;
  TASK_STATE_FAILED = 9;
}

// ProgressStatus is the stable lifecycle state disclosed by a progress event.
enum ProgressStatus {
  PROGRESS_STATUS_UNSPECIFIED = 0;
  PROGRESS_STATUS_QUEUED = 1;
  PROGRESS_STATUS_STARTED = 2;
  PROGRESS_STATUS_ADVANCING = 3;
  PROGRESS_STATUS_WAITING = 4;
  PROGRESS_STATUS_COMPLETED = 5;
  PROGRESS_STATUS_FAILED = 6;
  PROGRESS_STATUS_CANCELLED = 7;
}

// WorkflowNode describes one typed, versioned execution node.
message WorkflowNode {
  // node_id is stable within its workflow revision.
  string node_id = 1;
  // node_type names a certified native node type.
  string node_type = 2;
  // input_contract_digest pins the typed input contract.
  Digest input_contract_digest = 3;
  // output_contract_digest pins the typed output contract.
  Digest output_contract_digest = 4;
  // capability_requirements lists exact required action/resource capabilities.
  repeated string capability_requirements = 5;
  // budget_limits constrains node-specific resource consumption.
  repeated ResourceLimit budget_limits = 6;
  // requires_human_gate prevents autonomous execution until approved.
  bool requires_human_gate = 7;
}

// WorkflowEdge describes one typed dependency between workflow nodes.
message WorkflowEdge {
  // from_node_id is the producing node identifier.
  string from_node_id = 1;
  // to_node_id is the consuming node identifier.
  string to_node_id = 2;
  // state_contract_digest pins the state carried across the edge.
  Digest state_contract_digest = 3;
  // required is false only for explicitly optional edges.
  bool required = 4;
}

// WorkflowIR is the immutable typed graph compiled from an approved workflow draft.
message WorkflowIR {
  // workflow_id is an opaque immutable workflow revision identity.
  Identifier workflow_id = 1;
  // version is a monotonic human-readable revision label.
  string version = 2;
  // nodes is the complete typed node set.
  repeated WorkflowNode nodes = 3;
  // edges is the complete typed dependency set.
  repeated WorkflowEdge edges = 4;
  // evaluator_digest pins deterministic evaluation and promotion behavior.
  Digest evaluator_digest = 5;
  // workflow_digest binds the canonical compiled graph bytes.
  Digest workflow_digest = 6;
}

// Schedule defines a durable one-shot, recurring, or event-triggered run plan.
message Schedule {
  // schedule_id is an opaque schedule identity.
  Identifier schedule_id = 1;
  // workflow_id identifies the immutable workflow revision to invoke.
  Identifier workflow_id = 2;
  // trigger_kind is one_shot, cron, interval, or event.
  string trigger_kind = 3;
  // trigger_spec is a typed canonical trigger serialization digest, not arbitrary code.
  Digest trigger_spec_digest = 4;
  // time_zone identifies the IANA timezone used for calendar schedules.
  string time_zone = 5;
  // misfire_policy controls safe missed-occurrence behavior.
  MisfirePolicy misfire_policy = 6;
  // max_catch_up bounds any explicitly approved catch-up work.
  uint32 max_catch_up = 7;
  // standing_approval is required before effectful repeated execution.
  Approval standing_approval = 8;
  // paused prevents new occurrences without deleting immutable history.
  bool paused = 9;
}

// ScheduleRun records one fenced schedule occurrence and its result receipt.
message ScheduleRun {
  // run_id is an opaque occurrence identity.
  Identifier run_id = 1;
  // schedule_id identifies the durable schedule.
  Identifier schedule_id = 2;
  // scheduled_for records the intended occurrence time.
  google.protobuf.Timestamp scheduled_for = 3;
  // lease identifies the single fenced run owner.
  Lease lease = 4;
  // result records completion, retry, skip, or failure.
  Receipt result = 5;
}

// Task defines bounded work owned by the canonical shared roster.
message Task {
  // task_id is an opaque roster task identity.
  Identifier task_id = 1;
  // workflow_id identifies the parent immutable workflow revision.
  Identifier workflow_id = 2;
  // parent_task_id identifies an optional parent task without enabling redispatch.
  Identifier parent_task_id = 3;
  // goal_digest binds exact goal/specification inputs stored as immutable artifacts.
  Digest goal_digest = 4;
  // dependency_task_ids lists roster dependencies.
  repeated Identifier dependency_task_ids = 5;
  // owned_paths lists exact repository/module ownership boundaries.
  repeated string owned_paths = 6;
  // forbidden_paths lists explicit non-goals and protected write boundaries.
  repeated string forbidden_paths = 7;
  // state is the canonical task state.
  TaskState state = 8;
  // lease records the sole current fenced owner when leased.
  Lease lease = 9;
  // capability_grant pins authorized execution scope.
  CapabilityGrant capability_grant = 10;
  // budget_limits bounds task-level tokens, cost, time, and retries.
  repeated ResourceLimit budget_limits = 11;
  // acceptance_digest binds the required acceptance criteria.
  Digest acceptance_digest = 12;
}

// Roster is a durable snapshot reference for task ownership and progress.
message Roster {
  // roster_id is an opaque roster identity.
  Identifier roster_id = 1;
  // tasks contains the currently materialized task states.
  repeated Task tasks = 2;
  // watermark identifies the canonical ledger position represented by this roster.
  uint64 watermark = 3;
}

// MailboxKind constrains durable inter-agent communication semantics.
enum MailboxKind {
  MAILBOX_KIND_UNSPECIFIED = 0;
  MAILBOX_KIND_QUESTION = 1;
  MAILBOX_KIND_ANSWER = 2;
  MAILBOX_KIND_FINDING = 3;
  MAILBOX_KIND_EVIDENCE = 4;
  MAILBOX_KIND_DEPENDENCY_READY = 5;
  MAILBOX_KIND_BLOCKED = 6;
  MAILBOX_KIND_HANDOVER = 7;
  MAILBOX_KIND_REVIEW_REQUEST = 8;
  MAILBOX_KIND_REVIEW_RESULT = 9;
  MAILBOX_KIND_CORRECTION = 10;
  MAILBOX_KIND_CANCELLATION = 11;
}

// MailboxMessage is one ordered, durable, acknowledged task message.
message MailboxMessage {
  // message_id is an opaque durable message identity.
  Identifier message_id = 1;
  // kind identifies the typed communication purpose.
  MailboxKind kind = 2;
  // sender identifies the authenticated sending worker or human.
  AuthenticatedPrincipalRef sender = 3;
  // recipient_task_ids contains explicit targeted recipients.
  repeated Identifier recipient_task_ids = 4;
  // task_id identifies the related roster task.
  Identifier task_id = 5;
  // causal records sequence, correlation, and causation.
  CausalContext causal = 6;
  // payload_artifact holds encrypted, bounded message content.
  ArtifactRef payload_artifact = 7;
  // expires_at prevents stale guidance from becoming authority.
  google.protobuf.Timestamp expires_at = 8;
  // acknowledged_at records durable recipient acknowledgement.
  google.protobuf.Timestamp acknowledged_at = 9;
}

// Handover records a safe-point transfer request without moving the active fence itself.

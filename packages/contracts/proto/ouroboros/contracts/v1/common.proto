// Canonical cross-domain identifiers, envelopes, and receipts.
//
// These messages deliberately describe immutable facts and authority references,
// rather than authorization or state-transition implementation. Services must
// validate bounds, authenticated identity, and current fences before acting.
syntax = "proto3";

package ouroboros.contracts.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Identifier is an opaque, stable identifier within a declared namespace.
message Identifier {
  // namespace prevents an identifier string from crossing a domain boundary.
  string namespace = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64
  ];
  // value is opaque to consumers and must be non-empty after boundary validation.
  string value = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 512
  ];
}

// Digest identifies immutable bytes using a named digest algorithm.
message Digest {
  // algorithm identifies the canonical digest algorithm, for example sha256.
  string algorithm = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 32
  ];
  // hex is the lower-case encoded digest value.
  string hex = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 256
      pattern: "^[0-9a-f]+$"
    }
  ];
}

// FactualConsistencyStatus distinguishes a calibrated score from an answer
// that was not scored and from an answer that intentionally abstained.
enum FactualConsistencyStatus {
  // FACTUAL_CONSISTENCY_STATUS_UNSPECIFIED is invalid on a grounded answer.
  FACTUAL_CONSISTENCY_STATUS_UNSPECIFIED = 0;
  // FACTUAL_CONSISTENCY_STATUS_SCORED carries a calibrated score and provenance.
  FACTUAL_CONSISTENCY_STATUS_SCORED = 1;
  // FACTUAL_CONSISTENCY_STATUS_ABSTAINED means the answer made no factual claims.
  FACTUAL_CONSISTENCY_STATUS_ABSTAINED = 2;
  // FACTUAL_CONSISTENCY_STATUS_UNKNOWN means no calibrated score is available.
  FACTUAL_CONSISTENCY_STATUS_UNKNOWN = 3;
}

// FactualConsistencyReason explains a non-numeric result without exposing
// evidence, authorization, provider, or scorer error detail.
enum FactualConsistencyReason {
  // FACTUAL_CONSISTENCY_REASON_UNSPECIFIED accompanies a scored result.
  FACTUAL_CONSISTENCY_REASON_UNSPECIFIED = 0;
  // FACTUAL_CONSISTENCY_REASON_ANSWER_ABSTAINED accompanies answer abstention.
  FACTUAL_CONSISTENCY_REASON_ANSWER_ABSTAINED = 1;
  // FACTUAL_CONSISTENCY_REASON_SCORER_UNAVAILABLE means no calibrated scorer ran.
  FACTUAL_CONSISTENCY_REASON_SCORER_UNAVAILABLE = 2;
  // FACTUAL_CONSISTENCY_REASON_SCORER_FAILED collapses scorer failures and timeouts.
  FACTUAL_CONSISTENCY_REASON_SCORER_FAILED = 3;
  // FACTUAL_CONSISTENCY_REASON_INVALID_RESULT rejects malformed scorer output.
  FACTUAL_CONSISTENCY_REASON_INVALID_RESULT = 4;
  // FACTUAL_CONSISTENCY_REASON_BUDGET_EXCEEDED rejects over-bound scoring input.
  FACTUAL_CONSISTENCY_REASON_BUDGET_EXCEEDED = 5;
}

// FactualConsistencyProvenance pins the implementation and calibration bytes
// behind one numeric factual-consistency result. It never identifies evidence.
message FactualConsistencyProvenance {
  option (buf.validate.message).cel = {
    id: "factual_consistency_provenance.sha256_calibration"
    message: "calibration digest must be canonical SHA-256"
    expression: "this.calibration_digest.algorithm == 'sha256' && this.calibration_digest.hex.matches('^[0-9a-f]{64}$')"
  };
  // scorer_id is a stable implementation family, not a floating provider alias.
  string scorer_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];
  // scorer_version pins the exact scoring behavior.
  string scorer_version = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64
  ];
  // calibration_id identifies the declared calibration population and method.
  string calibration_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];
  // calibration_digest binds the immutable calibration artifact bytes.
  Digest calibration_digest = 4 [(buf.validate.field).required = true];
}

// FactualConsistencyScore is the bounded answer-level factual-consistency
// disclosure. Zero is a valid calibrated score only when status is SCORED;
// UNKNOWN and ABSTAINED never masquerade as numeric zero.
message FactualConsistencyScore {
  option (buf.validate.message).cel = {
    id: "factual_consistency_score.outcome_shape"
    message: "factual consistency scored, abstained, and unknown shapes must be explicit"
    expression: "this.status == 1 ? (this.reason == 0 && has(this.provenance) && this.total_claim_count > 0u && this.evaluated_claim_count == this.total_claim_count) : (this.status == 2 ? (this.reason == 1 && !has(this.provenance) && this.score_per_mille == 0u && this.total_claim_count == 0u && this.evaluated_claim_count == 0u) : (this.status == 3 ? (this.reason in [2, 3, 4, 5] && !has(this.provenance) && this.score_per_mille == 0u && this.evaluated_claim_count == 0u) : false))"
  };
  // status distinguishes scored, answer abstention, and unknown outcomes.
  FactualConsistencyStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // score_per_mille is a calibrated [0, 1000] estimate when status is SCORED.
  uint32 score_per_mille = 2 [(buf.validate.field).uint32.lte = 1000];
  // reason is unspecified only for a scored result.
  FactualConsistencyReason reason = 3 [(buf.validate.field).enum.defined_only = true];
  // provenance is required only for a scored result.
  FactualConsistencyProvenance provenance = 4;
  // evaluated_claim_count is the number of fully evaluated claims.
  uint32 evaluated_claim_count = 5 [(buf.validate.field).uint32.lte = 64];
  // total_claim_count is the bounded answer claim count presented to scoring.
  uint32 total_claim_count = 6 [(buf.validate.field).uint32.lte = 64];
}

// ArtifactRef identifies an immutable artifact without granting read access.
message ArtifactRef {
  // artifact_id is an opaque artifact identity.
  Identifier artifact_id = 1 [(buf.validate.field).required = true];
  // content_digest binds the reference to immutable content.
  Digest content_digest = 2 [(buf.validate.field).required = true];
  // tenant_id scopes the artifact identity and prevents cross-tenant reuse.
  Identifier tenant_id = 3 [(buf.validate.field).required = true];
}

// EvidenceRef identifies evidence metadata and optionally one precise anchor.
message EvidenceRef {
  // evidence_id is an opaque evidence identity.
  Identifier evidence_id = 1 [(buf.validate.field).required = true];
  // source_revision_id identifies the immutable source revision.
  Identifier source_revision_id = 2 [(buf.validate.field).required = true];
  // anchor_digest identifies an optional canonical anchor serialization.
  Digest anchor_digest = 3;
}

// AuthenticatedPrincipalRef is an identity assertion emitted by a trusted boundary.
message AuthenticatedPrincipalRef {
  // principal_id is never accepted as caller identity from an untrusted body.
  Identifier principal_id = 1 [(buf.validate.field).required = true];
  // tenant_id is the authenticated tenant context.
  Identifier tenant_id = 2 [(buf.validate.field).required = true];
  // session_id identifies the authenticated session when a session exists.
  Identifier session_id = 3;
}

// CausalContext binds messages to an ordered, fenced causal history.
message CausalContext {
  // correlation_id groups one user-visible operation.
  Identifier correlation_id = 1 [(buf.validate.field).required = true];
  // causation_id names the immediate triggering event or command.
  Identifier causation_id = 2 [(buf.validate.field).required = true];
  // trace_id identifies a separately authorized trace stream.
  Identifier trace_id = 3 [(buf.validate.field).required = true];
  // sequence is monotonically assigned by the canonical ledger.
  uint64 sequence = 4;
  // fence prevents an expired lease holder from committing.
  uint64 fence = 5;
  // watermark records the complete source position observed by a projection.
  uint64 watermark = 6;
}

// EventEnvelope records an immutable domain event and its causal metadata.
message EventEnvelope {
  // event_id is a globally unique opaque event identifier.
  Identifier event_id = 1 [(buf.validate.field).required = true];
  // event_type is a stable, versioned domain event name.
  string event_type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256
  ];
  // actor is the authenticated initiator or trusted machine observer.
  AuthenticatedPrincipalRef actor = 3 [(buf.validate.field).required = true];
  // occurred_at is the event observation time.
  google.protobuf.Timestamp occurred_at = 4 [(buf.validate.field).required = true];
  // idempotency_key distinguishes authenticated duplicate requests.
  string idempotency_key = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 512
  ];
  // causal records ordering, fence, and watermarks needed for replay.
  CausalContext causal = 6 [(buf.validate.field).required = true];
  // payload_digest binds the envelope to separately stored immutable bytes.
  Digest payload_digest = 7 [(buf.validate.field).required = true];
}

// CommandEnvelope requests a state transition; it is not authorization by itself.
message CommandEnvelope {
  // command_id is a globally unique opaque command identifier.
  Identifier command_id = 1 [(buf.validate.field).required = true];
  // command_type is a stable, versioned command name.
  string command_type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256
  ];
  // actor is the authenticated initiator supplied only by a trusted boundary.
  AuthenticatedPrincipalRef actor = 3 [(buf.validate.field).required = true];
  // submitted_at records when the command entered the admission boundary.
  google.protobuf.Timestamp submitted_at = 4 [(buf.validate.field).required = true];
  // idempotency_key is required for state-creating commands.
  string idempotency_key = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 512
  ];
  // causal carries expected sequence, fence, and current watermark.
  CausalContext causal = 6 [(buf.validate.field).required = true];
  // payload_digest binds the command body held in immutable storage.
  Digest payload_digest = 7 [(buf.validate.field).required = true];
}

// ReceiptStatus is a stable disposition that never exposes upstream error bodies.
enum ReceiptStatus {
  RECEIPT_STATUS_UNSPECIFIED = 0;
  RECEIPT_STATUS_ACCEPTED = 1;
  RECEIPT_STATUS_REJECTED = 2;
  RECEIPT_STATUS_DEFERRED = 3;
  RECEIPT_STATUS_COMPLETED = 4;
  RECEIPT_STATUS_PARTIAL = 5;
}

// Receipt records the authoritative outcome of an admitted operation.
message Receipt {
  // receipt_id is a globally unique opaque receipt identifier.
  Identifier receipt_id = 1 [(buf.validate.field).required = true];
  // status is a stable, machine-readable outcome.
  ReceiptStatus status = 2 [(buf.validate.field).required = true];
  // reason_code is a non-sensitive stable reason, never an upstream error body.
  string reason_code = 3;
  // operation_id identifies the command, run, or effect being receipted.
  Identifier operation_id = 4 [(buf.validate.field).required = true];
  // causal binds the outcome to replayable ordering and fencing state.
  CausalContext causal = 5 [(buf.validate.field).required = true];
  // recorded_at is when the receipt became canonical.
  google.protobuf.Timestamp recorded_at = 6 [(buf.validate.field).required = true];
  // evidence records immutable inputs and outputs supporting this outcome.
  repeated EvidenceRef evidence = 7;
  // configuration_digest pins the effective configuration without secret plaintext.
  Digest configuration_digest = 8 [(buf.validate.field).required = true];
}

// Approval records one authenticated, scope-limited human or policy decision.
message Approval {
  // approval_id is an opaque approval identifier.
  Identifier approval_id = 1 [(buf.validate.field).required = true];
  // approver is the authenticated authority that issued the decision.
  AuthenticatedPrincipalRef approver = 2 [(buf.validate.field).required = true];
  // scope_digest binds the approval to the exact reviewed scope.
  Digest scope_digest = 3 [(buf.validate.field).required = true];
  // expires_at limits reuse of the approval.
  google.protobuf.Timestamp expires_at = 4 [(buf.validate.field).required = true];
  // receipt records the authorization decision and policy version.
  Receipt receipt = 5 [(buf.validate.field).required = true];
}

// Lease identifies one fenced, expiring owner of a task or scheduled run.
message Lease {
  // lease_id is an opaque lease identifier.
  Identifier lease_id = 1 [(buf.validate.field).required = true];
  // holder is the authenticated worker principal.
  AuthenticatedPrincipalRef holder = 2 [(buf.validate.field).required = true];
  // fence advances when ownership changes and invalidates old holders.
  uint64 fence = 3 [(buf.validate.field).uint64.gt = 0];
  // expires_at prevents an abandoned holder from remaining authoritative.
  google.protobuf.Timestamp expires_at = 4 [(buf.validate.field).required = true];
}

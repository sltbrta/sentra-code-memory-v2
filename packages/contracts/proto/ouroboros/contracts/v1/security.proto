// Canonical capability, egress, authorization, and effect-approval descriptions.
//
// A grant is a serializable attenuation record. It is never an authorization
// cache: an effect handler must still reauthorize it against current policy.
syntax = "proto3";

package ouroboros.contracts.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "ouroboros/contracts/v1/common.proto";

// ResourceLimit bounds one measurable resource a grant may consume.
message ResourceLimit {
  // name is a stable resource dimension such as token, wall_time_ms, or bytes.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[a-z][a-z0-9_]*$"
    }
  ];
  // maximum is an inclusive strictly positive ceiling.
  uint64 maximum = 2 [(buf.validate.field).uint64.gt = 0];
}

// ToolGrant narrows authority to one certified or quarantined tool package.
message ToolGrant {
  // tool_package_digest pins the exact signed package bytes.
  Digest tool_package_digest = 1 [(buf.validate.field).required = true];
  // allowed_operations lists stable tool operation names.
  repeated string allowed_operations = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[a-z][a-z0-9_.:-]{0,127}$"
      }
    }
  }];
  // input_artifacts lists exact immutable artifact identities allowed as input.
  repeated ArtifactRef input_artifacts = 3 [(buf.validate.field).repeated.max_items = 64];
  // limits bounds time, bytes, processes, and other resource dimensions.
  repeated ResourceLimit limits = 4 [(buf.validate.field).repeated.max_items = 32];
}

// EgressManifest records the minimum disclosed material and the policy decision.
message EgressManifest {
  // manifest_id is an opaque manifest identity.
  Identifier manifest_id = 1 [(buf.validate.field).required = true];
  // destination identifies the approved provider, connector, or tool endpoint.
  string destination = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256
  ];
  // classification records the effective data-classification decision.
  string classification = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64
  ];
  // allowed_artifacts is the exact immutable input set permitted to leave.
  repeated ArtifactRef allowed_artifacts = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];
  // policy_digest pins the egress policy and provider/model selection.
  Digest policy_digest = 5 [(buf.validate.field).required = true];
  // expires_at prevents replay after an authorization window closes.
  google.protobuf.Timestamp expires_at = 6 [(buf.validate.field).required = true];
}

// CapabilityGrant is an attenuated, expiring grant bound to one execution scope.
message CapabilityGrant {
  // grant_id is an opaque grant identity.
  Identifier grant_id = 1 [(buf.validate.field).required = true];
  // initiator is the authenticated principal whose authority was attenuated.
  AuthenticatedPrincipalRef initiator = 2 [(buf.validate.field).required = true];
  // task_id scopes the grant to one roster task when applicable.
  Identifier task_id = 3;
  // workflow_id scopes the grant to one immutable workflow revision.
  Identifier workflow_id = 4;
  // lease binds effects to the current fenced execution holder.
  Lease lease = 5;
  // actions lists exact typed operations; wildcards are invalid at admission.
  repeated string actions = 6 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[a-z][a-z0-9_.:-]{0,127}$"
      }
    }
  }];
  // resources lists exact tenant-scoped resources; absent resources deny action.
  repeated Identifier resources = 7 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];
  // repository_git_oid pins the permitted source snapshot.
  string repository_git_oid = 8 [(buf.validate.field).string.max_len = 128];
  // allowed_paths lists normalized repository-relative path prefixes.
  repeated string allowed_paths = 9 [(buf.validate.field).repeated = {
    max_items: 64
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 512
      }
    }
  }];
  // tool_grants narrows invocable tool packages.
  repeated ToolGrant tool_grants = 10 [(buf.validate.field).repeated.max_items = 16];
  // egress restricts material permitted to leave the current authority zone.
  repeated EgressManifest egress = 11 [(buf.validate.field).repeated.max_items = 16];
  // limits bounds total authority consumption.
  repeated ResourceLimit limits = 12 [(buf.validate.field).repeated.max_items = 32];
  // nonce prevents cross-request and replay reuse.
  string nonce = 13 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];
  // revocation_epoch invalidates grants after current deny state advances.
  uint64 revocation_epoch = 14;
  // expires_at prevents a grant from becoming standing authority.
  google.protobuf.Timestamp expires_at = 15 [(buf.validate.field).required = true];
  // policy_digest pins the policy evaluated during grant issuance.
  Digest policy_digest = 16 [(buf.validate.field).required = true];
  // command_fence binds this grant to one current command-scope fence.
  uint64 command_fence = 17 [(buf.validate.field).uint64.gt = 0];
}

// AuthorizationReceipt records a current authorization or reauthorization decision.
message AuthorizationReceipt {
  // receipt is the canonical decision receipt.
  Receipt receipt = 1;
  // grant_id identifies the evaluated capability grant.
  Identifier grant_id = 2;
  // action is the exact typed action evaluated.
  string action = 3;
  // resource identifies the exact scoped resource evaluated.
  Identifier resource = 4;
  // acl_epoch records the current deny-overlay epoch.
  uint64 acl_epoch = 5;
}

// EffectApproval binds one approved, idempotent external effect to its authority.
message EffectApproval {
  // approval is the scoped human or policy approval.
  Approval approval = 1;
  // grant identifies the current attenuated capability used for the effect.
  CapabilityGrant grant = 2;
  // idempotency_key distinguishes safe retries from conflicting repeats.
  string idempotency_key = 3;
  // authorization records the last current-policy check before the effect.
  AuthorizationReceipt authorization = 4;
}

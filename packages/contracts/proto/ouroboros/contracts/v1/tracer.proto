  // shard_id is the fixed shard identity.
  string shard_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {const: "tracer-001/evidence/0001"}
  ];
  // input_bundle_digest binds the full immutable input bundle.
  Digest input_bundle_digest = 4 [(buf.validate.field).required = true];
  // source_artifact_digest pins the validated source artifact.
  Digest source_artifact_digest = 5 [(buf.validate.field).required = true];
  // source_revision is the source revision digest hex binding.
  Digest source_revision = 6 [(buf.validate.field).required = true];
  // source_byte_length is the validated source byte count.
  uint64 source_byte_length = 7;
  // span_byte_interval is the validated supporting-span byte interval.
  ByteInterval span_byte_interval = 8 [(buf.validate.field).required = true];
  // span_line_interval is the validated supporting-span line interval.
  LineInterval span_line_interval = 9 [(buf.validate.field).required = true];
  // span_digest is the recomputed span digest.
  Digest span_digest = 10 [(buf.validate.field).required = true];
  // anchor_digest is the recomputed anchor digest.
  Digest anchor_digest = 11 [(buf.validate.field).required = true];
  // result_code is the deterministic shard result.
  TracerShardResultCode result_code = 12 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // validated_file_count is the number of source files validated.
  uint32 validated_file_count = 13;
  // validated_span_count is the number of spans validated.
  uint32 validated_span_count = 14;
  // output_digest binds the full logical output.
  Digest output_digest = 15 [(buf.validate.field).required = true];
}

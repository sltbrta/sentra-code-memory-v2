[package]
name = "ouroboros-code-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-Proprietary"
publish = false
description = "Stage 1 deterministic boundary for the Ouroboros code-index worker."

[lib]
name = "ouroboros_code_index"
path = "src/lib.rs"

[[bin]]
name = "ouroboros-code-index"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
